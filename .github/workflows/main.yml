name: Moonbeam Kernel Compilation

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: quadro-kal/moonbeam_gale_kernel
          ref: moonbeam
          depth: 1

      - name: Initialize Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 \
          gcc clang libssl-dev repo flex bison crossbuild-essential-arm64 crossbuild-essential-armel

      - name: Provision Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchains/clang

      - name: Execute Kernel Compilation
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          DEFCONFIG_NAME="gale_defconfig"

          # 1. Menghasilkan file konfigurasi dasar dari defconfig lama
          make O=out ARCH=arm64 $DEFCONFIG_NAME
          
          # 2. LANGKAH PENSTABILAN: Mengisi otomatis fitur Clang baru dengan nilai default aman (Mencegah Error EOF)
          make O=out ARCH=arm64 olddefconfig

          # 3. Menjalankan proses kompilasi multi-threaded
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-


      - name: Extract and Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moonbeam-Kernel-Artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/
